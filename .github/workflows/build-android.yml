name: 构建 Android APK 并发布 Release

on:
  push:
    branches: [android]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 安装 Capacitor CLI
        run: npm i -g @capacitor/cli

      - name: 初始化 Capacitor Android
        run: npx cap add android

      - name: 同步 web 资源到 Android
        run: npx cap sync android

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 构建 debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yunhu-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 发布 APK 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TAG=android-latest
          # 同名 release 先删掉（保留 latest 语义，避免重复堆积）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "云湖客户端 Android（debug，自动构建）" \
            --notes "自动触发构建 · commit ${{ github.sha }}
          
          - 构建时间：${{ github.event.head_commit.timestamp || '手动触发' }}
          - APK：app-debug.apk（未签名，仅供测试）
          
          > 安装后打开，在「设置 → API 基址」里填你的云湖服务地址即可使用。" \
            --latest