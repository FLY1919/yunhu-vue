[package]
name = "yunhulaoda-desktop"
version = "1.0.22"
description = "云湖牢大版桌面客户端（Tauri 壳 + Node sidecar 服务）"
authors = ["yibanm"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 外链用系统默认浏览器打开（WebView2 会拦 target=_blank 导航，用户报「点网址不跳转」）
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.58", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_Storage_EnhancedStorage"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
